<!DOCTYPE html>
<html lang="zh-CN"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>APNG 封面生成器</title>
    <style>
        body {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px;
            line-height: 1.6;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 0.2em;
        }
        .hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0;
        }
        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        button {
            padding: 5px 20px;
            border-radius: 8px;
            border: none;
            background: #2b6cb0;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1.6;
        }
        button:hover:not(:disabled) {
            background: #2c5282;
        }
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        a.dl {
            display: inline-block;
            padding: 5px 20px;
            border-radius: 8px;
            background: #276749;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
        }
        #status {
            font-size: 0.92rem;
            color: #666;
            min-height: 1.4em;
        }
        #preview {
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 16px;
            background: #f1f1f2;
        }
        #previewWrap {
            display: none;
        }
    </style>
</head>
<body>
    <h1>APNG 封面生成器</h1>
    <p class="hint">
        建议不要使用太大分辨率的图片，可能会需要较长时间。
    </p>

    <div class="row">
        <input type="file" id="file" accept="image/png, .png, image/jpeg, .jpg, .jpeg">
        <button id="run" disabled>生成</button>
        <a id="dl" class="dl" style="display: none">下载结果</a>
    </div>

    <div id="status"></div>
    <div id="previewWrap"><img id="preview" alt="预览"></div>

    <script type="module">
        const fileEl = document.getElementById("file");
        const runEl = document.getElementById("run");
        const dlEl = document.getElementById("dl");
        const statusEl = document.getElementById("status");
        const prevEl = document.getElementById("preview");
        const wrapEl = document.getElementById("previewWrap");

        let inputBytes = null;
        let inputName = "";
        let lastUrl = null;
        let reqId = 0;
        let pending = new Map(); // id -> resolve
        let start_time = 0;
        let timer = null;

        // ---------- 启动 Worker ----------
        const worker = new Worker("./worker.7fc17ab0.js", { type: "module" });

        worker.onerror = (e) => {
            statusEl.textContent = "Worker 错误：" + (e.message || e);
            console.error(e);
        };

        worker.onmessage = (e) => {
            const msg = e.data;

            if (msg.type === "ready") {
                statusEl.textContent = "已就绪，请选择 PNG 文件。";
                return;
            }

            const resolve = pending.get(msg.id);
            if (!resolve) return;
            pending.delete(msg.id);

            if (msg.type === "done") {
                resolve({
                    ok: true,
                    output: new Uint8Array(msg.output),
                    ms: msg.ms,
                });
            } else if (msg.type === "error") {
                resolve({ ok: false, error: msg.message });
            }
        };

        // ---------- 工具：向 Worker 发一个带 id 的请求 ----------
        function callWorker(bytes) {
            const id = ++reqId;
            return new Promise((resolve) => {
                pending.set(id, resolve);
                // 复制一份 buffer 过去（input 用户可能还会重新选文件）
                const copy = bytes.slice();
                worker.postMessage({ id, input: copy.buffer }, [
                    copy.buffer,
                ]);
            });
        }

        // ---------- 选择文件 ----------
        fileEl.addEventListener("change", async () => {
            const f = fileEl.files?.[0];
            if (!f) return;

            inputName = f.name;
            inputBytes = new Uint8Array(await f.arrayBuffer());

            statusEl.textContent = `已选择 ${f.name}（${inputBytes.length.toLocaleString()} 字节）`;
            runEl.disabled = false;
            dlEl.style.display = "none";
            wrapEl.style.display = "none";
        });

        // ---------- 点击生成 ----------
        runEl.addEventListener("click", async () => {
            if (!inputBytes) return;

            runEl.disabled = true;
            statusEl.textContent = "处理中...";
            dlEl.style.display = "none";
            start_time = Date.now();
            console.log(start_time);
            timer = setInterval(() => {
                const use = Math.floor((Date.now() - start_time) / 10);
                statusEl.textContent = `处理中 ${(use / 100).toFixed(2)}s`;
            }, 100);

            const res = await callWorker(inputBytes);
            clearInterval(timer);

            if (!res.ok) {
                statusEl.textContent = "失败：" + res.error;
                runEl.disabled = false;
                return;
            }

            const blob = new Blob([res.output], { type: "image/png" });
            if (lastUrl) URL.revokeObjectURL(lastUrl);
            lastUrl = URL.createObjectURL(blob);

            const base = inputName.replace(/\.png$/i, "") || "output";
            dlEl.href = lastUrl;
            dlEl.download = `${base}-cover.png`;
            dlEl.style.display = "inline-block";

            prevEl.src = lastUrl;
            wrapEl.style.display = "block";

            statusEl.textContent = `完成：输出 ${res.output.length.toLocaleString()} 字节，耗时 ${(res.ms / 1000).toFixed(2)} s`;
            runEl.disabled = false;
        });
    </script>
</body></html>
